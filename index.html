<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشاركة الموقع الحي</title>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border-radius: 32px;
            padding: 30px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #333;
            text-align: center;
        }
        .status-badge {
            display: inline-block;
            background: #2a6b3c;
            color: #8affb2;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .status-badge.inactive { background: #6b2a2a; color: #ff8a8a; }
        .coords-display {
            font-size: 28px;
            font-family: 'Courier New', monospace;
            background: #000;
            padding: 16px;
            border-radius: 16px;
            margin: 12px 0;
            color: #8ab4f8;
            border: 1px solid #2a2a2a;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .info-card {
            background: #111;
            padding: 12px 6px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }
        .info-card .label { font-size: 11px; color: #777; text-transform: uppercase; }
        .info-card .value { font-size: 18px; font-weight: 700; margin-top: 4px; color: #eee; }
        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 16px 0 8px;
            color: #8ab4f8;
        }
        .pulse-dot {
            width: 12px; height: 12px;
            background: #34a853;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        .btn {
            background: #8ab4f8;
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background: #a8c8fa; transform: scale(1.02); }
        .btn-danger { background: #d93025; color: #fff; }
        .btn-danger:hover { background: #b3261e; }
        .sub-text { color: #666; font-size: 13px; margin-top: 14px; }
        .input-group {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .input-group input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font-size: 16px;
            text-align: center;
            min-width: 150px;
        }
        .input-group button {
            flex: 0 0 auto;
            padding: 12px 24px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h3 style="color:#8ab4f8; margin-bottom:16px;">📍 مشاركة الموقع الحي</h3>

        <div id="joinBox">
            <div style="color:#888; margin-bottom:8px;">أدخل معرف الغرفة الذي أعطاك إياه المشرف:</div>
            <div class="input-group">
                <input type="text" id="roomInput" placeholder="معرف الغرفة">
                <button onclick="connectToRoom()" style="background:#81c995; color:#000;">اتصال</button>
            </div>
            <div id="joinError" style="color:#f28b82; margin-top:8px;"></div>
        </div>

        <div id="trackingBox" class="hidden">
            <div class="status-badge" id="statusBadge">🟢 جاري البث المباشر</div>
            <div style="font-size: 14px; color: #888; margin-bottom: 4px;">الإحداثيات الحالية</div>
            <div class="coords-display" id="coordsDisplay">— , —</div>
            <div class="info-grid">
                <div class="info-card"><div class="label">الدقة</div><div class="value" id="accuracy">—</div></div>
                <div class="info-card"><div class="label">السرعة</div><div class="value" id="speed">0 km/h</div></div>
                <div class="info-card"><div class="label">الاتجاه</div><div class="value" id="heading">—</div></div>
            </div>
            <div class="live-indicator">
                <span class="pulse-dot"></span>
                <span>مدة البث: <strong id="timer">00:00</strong></span>
            </div>
            <button class="btn btn-danger" id="stopBtn" onclick="stopSharing()">⏹️ إيقاف المشاركة</button>
            <div class="sub-text">يتم تحديث موقعك تلقائياً كل 3 ثوانٍ</div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. المتغيرات
        // ============================================================
        let peer = null;
        let connection = null;
        let roomId = '';
        let watchId = null;
        let startTime = Date.now();
        let timerInterval = null;
        let isActive = true;
        let lastSentData = null;

        const joinBox = document.getElementById('joinBox');
        const trackingBox = document.getElementById('trackingBox');
        const statusBadge = document.getElementById('statusBadge');
        const coordsDisplay = document.getElementById('coordsDisplay');
        const accuracyEl = document.getElementById('accuracy');
        const speedEl = document.getElementById('speed');
        const headingEl = document.getElementById('heading');
        const timerEl = document.getElementById('timer');
        const joinError = document.getElementById('joinError');

        // ============================================================
        // 2. دوال مساعدة
        // ============================================================
        function setStatus(text, isError = false) {
            statusBadge.textContent = text;
            statusBadge.className = `status-badge${isError ? ' inactive' : ''}`;
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            timerEl.textContent = `${mins}:${secs}`;
        }

        // ============================================================
        // 3. الاتصال بالمشرف
        // ============================================================
        function connectToRoom() {
            const id = document.getElementById('roomInput').value.trim();
            if (!id) {
                joinError.textContent = 'الرجاء إدخال معرف الغرفة';
                return;
            }
            roomId = id;
            joinError.textContent = '';
            joinBox.style.display = 'none';
            trackingBox.classList.remove('hidden');

            // إنشاء Peer جديد
            peer = new Peer({ debug: 2 });
            peer.on('open', (myId) => {
                // الاتصال بمعرف المشرف
                connection = peer.connect(roomId);
                connection.on('open', () => {
                    setStatus('🟢 متصل، جاري البث');
                    startTracking();
                });
                connection.on('error', (err) => {
                    setStatus('⚠️ خطأ في الاتصال', true);
                    console.error(err);
                });
                connection.on('close', () => {
                    setStatus('🔴 انقطع الاتصال', true);
                    stopSharing();
                });
            });
            peer.on('error', (err) => {
                setStatus('⚠️ فشل الاتصال', true);
                joinError.textContent = 'تعذر الاتصال: ' + err.message;
                console.error(err);
            });
        }

        // ============================================================
        // 4. تتبع الموقع وإرساله
        // ============================================================
        function startTracking() {
            if (!navigator.geolocation) {
                setStatus('❌ المتصفح لا يدعم GPS', true);
                return;
            }
            navigator.geolocation.getCurrentPosition(() => {}, () => {}, {});
            watchId = navigator.geolocation.watchPosition(
                (pos) => sendLocation(pos),
                (err) => {
                    console.warn('GPS error:', err.message);
                    setStatus('⚠️ مشكلة في GPS', true);
                    if (err.code === 1) setStatus('🚫 تم رفض الإذن', true);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );
            timerInterval = setInterval(updateTimer, 1000);
        }

        function sendLocation(position) {
            if (!isActive || !connection || connection.peerConnection?.iceConnectionState !== 'connected') return;

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const acc = position.coords.accuracy ? Math.round(position.coords.accuracy) : null;
            const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0;
            const heading = position.coords.heading ? Math.round(position.coords.heading) : null;

            // تحديث الواجهة
            coordsDisplay.textContent = `${lat.toFixed(7)}, ${lng.toFixed(7)}`;
            accuracyEl.textContent = acc ? `${acc} m` : '—';
            speedEl.textContent = speed > 0 ? `${speed} km/h` : '0 km/h';
            headingEl.textContent = heading ? `${heading}°` : '—';
            setStatus('🟢 جاري البث المباشر');

            const data = {
                type: 'location',
                lat, lng,
                accuracy: acc,
                speed: parseFloat(speed),
                heading,
                timestamp: Date.now()
            };

            const dataStr = JSON.stringify(data);
            if (lastSentData === dataStr) return;
            lastSentData = dataStr;

            connection.send(data);
        }

        // ============================================================
        // 5. إيقاف المشاركة
        // ============================================================
        function stopSharing() {
            if (!isActive) return;
            isActive = false;
            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            setStatus('⏹️ تم إيقاف البث', true);
            document.getElementById('stopBtn').textContent = '🔁 إعادة التشغيل';
            document.getElementById('stopBtn').onclick = () => window.location.reload();
            if (connection) connection.close();
        }

        // ============================================================
        // 6. بدء التشغيل (قراءة المعرف من الرابط)
        // ============================================================
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            if (room) {
                document.getElementById('roomInput').value = room;
                connectToRoom();
            }
        };

        window.connectToRoom = connectToRoom;
        window.stopSharing = stopSharing;

        console.log('📍 صفحة الزائر جاهزة');
    </script>
</body>
</html>
