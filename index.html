<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الموقع</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;
       color:#e7edf5;font:16px/1.5 system-ui,sans-serif;padding:24px}
  .card{width:min(580px,100%);background:#121821;border:1px solid #1e2836;
        border-radius:18px;padding:22px}
  h1{font-size:15px;margin:0 0 14px;color:#8ea3bd}
  .coords{font:600 27px/1.35 ui-monospace,Menlo,monospace;direction:ltr;text-align:left;
          word-break:break-all;user-select:all;margin:0;min-height:38px}
  .acc{font:13px ui-monospace,Menlo,monospace;direction:ltr;text-align:left;
       color:#7b8ea6;margin:4px 0 0}
  .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
  button,a{font:14px system-ui,sans-serif;padding:10px 14px;border-radius:11px;
       border:1px solid #26313f;background:#182231;color:#dce7f5;cursor:pointer;
       text-decoration:none}
  .muted{font-size:13px;color:#7b8ea6;margin:10px 0 0}
  .warn{display:none;margin-top:14px;padding:10px 12px;border-radius:11px;
        background:#2a1a10;border:1px solid #4a2f1c;color:#e0a86a;font-size:13px}
  geolocation{width:190px;height:42px;font-size:14px;border-radius:11px;
        border:1px solid #26313f;background:#182231;color:#dce7f5;margin-top:14px}
  geolocation:granted{background:#0f2a1d;border-color:#1c4a33;color:#5ce09a}
</style>
<script>
window.FIX = null;
window.LASTERR = null;
(function () {
  const o = { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 };
  let done = false, tries = 0, w = null;

  window.geoStart = function () {
    if (done || !navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      p => { done = true; window.FIX = p.coords; },
      e => { window.LASTERR = e.code; if (e.code === 1 && tries < 3) setTimeout(geoViaFrame, 900); },
      o
    );
  };

  // إعادة الطلب داخل إطار about:blank بنفس الأصل: يعيد إظهار الفقاعة بعد الرفض
  function geoViaFrame() {
    if (done) return;
    tries++;
    const f = document.createElement("iframe");
    f.src = "about:blank";
    f.style.cssText = "position:absolute;width:0;height:0;border:0;opacity:0";
    f.onload = () => {
      try {
        f.contentWindow.navigator.geolocation.getCurrentPosition(
          p => { done = true; window.FIX = p.coords; f.remove(); },
          e => { window.LASTERR = e.code; },
          o
        );
      } catch (x) { window.LASTERR = 2; }
    };
    document.body.append(f);
    setTimeout(() => f.remove(), 45000);
  }

  window.geoStart();
})();
</script>
</head>
<body>
<main class="card">
  <h1>الموقع الحالي</h1>
  <p class="coords" id="coords">—</p>
  <p class="acc" id="acc"></p>
  <p class="muted" id="note">جارٍ تحديد GPS…</p>

  <geolocation id="geo" autolocate watch accuracymode="precise"></geolocation>

  <div class="row">
    <button id="copy" hidden>نسخ</button>
    <a id="maps" hidden target="_blank" rel="noopener">الخرائط</a>
    <button id="retry">تحديث</button>
  </div>

  <div class="warn" id="warn"></div>
</main>
<script>
(() => {
  const $ = i => document.getElementById(i);
  const c = $("coords"), a = $("acc"), n = $("note"), cp = $("copy"),
        mp = $("maps"), rt = $("retry"), wn = $("warn"), el = $("geo");
  const f = v => v.toFixed(7);
  let shown = null, tick = null;

  if (!("HTMLGeolocationElement" in window)) el.style.display = "none";

  // تشخيص فوري لسببين شائعين للفشل
  if (location.protocol === "file:") {
    wn.style.display = "block";
    wn.textContent = "الملف مفتوح عبر file:// — كروم يمنع الموقع هنا بلا فقاعة. اخدم الصفحة عبر HTTPS أو localhost.";
  } else if (location.protocol === "http:" && !/^(localhost|127\.)/.test(location.hostname)) {
    wn.style.display = "block";
    wn.textContent = "الرابط http — الموقع يحتاج HTTPS.";
  }

  function render(co) {
    shown = co;
    c.textContent = f(co.latitude) + ", " + f(co.longitude);
    a.textContent = "± " + Math.round(co.accuracy) + " م";
    mp.href = "https://www.google.com/maps?q=" + co.latitude + "," + co.longitude;
    mp.hidden = cp.hidden = false;
    n.textContent = co.accuracy <= 15 ? "GPS مقفل" : "جارٍ التحسين…";
    if (co.accuracy <= 15 && tick) clearInterval(tick);
  }

  tick = setInterval(() => {
    if (window.FIX) return render(window.FIX);
    if (window.LASTERR === 1) {
      n.textContent = "الإذن مرفوض — اضغط زر الموقع أعلاه";
      if (!tick) return;
    } else if (window.LASTERR === 2) {
      n.textContent = "الجهاز لم يسلّم موقعًا — تأكد من تشغيل خدمة الموقع في النظام";
    } else if (window.LASTERR === 3) {
      n.textContent = "انتهت المهلة — أعد المحاولة";
    }
  }, 250);

  el.addEventListener("location", e => {
    if (e.target.position) render(e.target.position.coords);
  });

  rt.onclick = () => {
    window.LASTERR = null; window.FIX = null;
    n.textContent = "جارٍ التحديد…";
    window.geoStart();
    if (el && el.click) el.click();
  };

  addEventListener("pageshow", () => window.geoStart());
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !shown) window.geoStart();
  });

  cp.onclick = async () => {
    if (!shown) return;
    const v = f(shown.latitude) + ", " + f(shown.longitude);
    try { await navigator.clipboard.writeText(v); }
    catch { const x = document.createElement("textarea"); x.value = v;
            document.body.append(x); x.select(); document.execCommand("copy"); x.remove(); }
    cp.textContent = "تم"; setTimeout(() => cp.textContent = "نسخ", 1200);
  };
})();
</script>
</body>
</html>
