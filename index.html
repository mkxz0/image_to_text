<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دردشة محلية</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm" id="webllm-module"></script>
<style>
  :root{
    --bg:#f5f5f7; --surface:#ffffff; --text:#1c1c1e; --sub:#6e6e73;
    --accent:#0a7cff; --bubble-user:#0a7cff; --bubble-user-text:#fff;
    --bubble-ai:#e9e9eb; --bubble-ai-text:#1c1c1e; --border:#d8d8dc;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000; --surface:#1c1c1e; --text:#f5f5f7; --sub:#9a9aa0;
      --bubble-ai:#2c2c2e; --bubble-ai-text:#f5f5f7; --border:#3a3a3c;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    padding:14px 16px; text-align:center; border-bottom:1px solid var(--border);
    background:var(--surface); position:sticky; top:0; z-index:5;
  }
  header h1{font-size:16px;margin:0 0 2px}
  header p{font-size:12px;color:var(--sub);margin:0}
  #status{padding:10px 16px;font-size:13px;color:var(--sub);text-align:center}
  #progress{height:4px;background:var(--border);border-radius:2px;margin:0 16px;overflow:hidden}
  #progress div{height:100%;width:0%;background:var(--accent);transition:width .3s}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 14px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
  .user{align-self:flex-end;background:var(--bubble-user);color:var(--bubble-user-text);border-bottom-left-radius:4px}
  .ai{align-self:flex-start;background:var(--bubble-ai);color:var(--bubble-ai-text);border-bottom-right-radius:4px}
  #inputBar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
  #inputBar textarea{
    flex:1;resize:none;border:1px solid var(--border);border-radius:14px;
    padding:10px 12px;font-size:15px;background:var(--bg);color:var(--text);
    max-height:100px;font-family:inherit;
  }
  #sendBtn{
    background:var(--accent);color:#fff;border:none;border-radius:14px;
    padding:0 18px;font-size:15px;font-weight:600;cursor:pointer;
  }
  #sendBtn:disabled{opacity:.4}
  select{border-radius:10px;border:1px solid var(--border);padding:4px 8px;background:var(--surface);color:var(--text);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>🔒 دردشة محلية بالكامل</h1>
  <p>كل المعالجة تتم داخل هاتفك — لا شيء يُرسل لأي سيرفر</p>
</header>
<div id="status">اختر نموذجًا ثم اضغط تحميل</div>
<div id="progress"><div id="bar"></div></div>
<div style="display:flex;gap:8px;justify-content:center;padding:8px">
  <select id="modelSelect">
    <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (الأسرع، ~700MB)</option>
    <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B (أدق، ~1.9GB)</option>
    <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi 3.5 mini (~2.3GB)</option>
  </select>
  <button id="loadBtn" style="border-radius:10px;border:none;background:var(--accent);color:#fff;padding:6px 14px;font-size:13px">تحميل</button>
</div>
<div id="chat"></div>
<div id="inputBar">
  <textarea id="userInput" placeholder="اكتب رسالتك..." rows="1" disabled></textarea>
  <button id="sendBtn" disabled>إرسال</button>
</div>

<script type="module">
  const statusEl = document.getElementById('status');
  const bar = document.getElementById('bar');
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const loadBtn = document.getElementById('loadBtn');
  const modelSelect = document.getElementById('modelSelect');

  let engine = null;
  let history = [];

  function addMsg(text, cls){
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  loadBtn.addEventListener('click', async () => {
    loadBtn.disabled = true;
    modelSelect.disabled = true;
    try {
      const webllm = await import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm");
      const modelId = modelSelect.value;
      engine = new webllm.MLCEngine();
      engine.setInitProgressCallback((report) => {
        statusEl.textContent = report.text || 'جارٍ التحميل...';
        const pct = Math.round((report.progress || 0) * 100);
        bar.style.width = pct + '%';
      });
      await engine.reload(modelId);
      statusEl.textContent = '✅ النموذج جاهز — ابدأ الدردشة';
      bar.style.width = '100%';
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    } catch (err) {
      statusEl.textContent = '❌ فشل التحميل: ' + err.message + ' (تأكد أن سفاري محدث لدعم WebGPU)';
      loadBtn.disabled = false;
      modelSelect.disabled = false;
    }
  });

  async function send(){
    const text = input.value.trim();
    if(!text || !engine) return;
    addMsg(text, 'user');
    history.push({role:'user', content:text});
    input.value='';
    input.disabled = true;
    sendBtn.disabled = true;
    const aiBubble = addMsg('...', 'ai');
    try {
      const reply = await engine.chat.completions.create({
        messages: history,
        temperature: 0.8,
        stream: true
      });
      let full = '';
      for await (const chunk of reply){
        full += chunk.choices[0]?.delta?.content || '';
        aiBubble.textContent = full;
        chat.scrollTop = chat.scrollHeight;
      }
      history.push({role:'assistant', content: full});
    } catch(err){
      aiBubble.textContent = 'خطأ: ' + err.message;
    }
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });
</script>
</body>
</html>
