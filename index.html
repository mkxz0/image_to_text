<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض جهات الاتصال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            color: #1a237e;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            background: #1a237e;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            background: #0d1445;
            transform: scale(1.02);
        }
        .btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            margin: 15px 0;
            text-align: center;
            color: #555;
            font-size: 15px;
            min-height: 24px;
        }
        .contact-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .contact-item {
            background: #f0f2f5;
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 5px solid #1a237e;
        }
        .contact-name {
            font-weight: 600;
            color: #1a1a1a;
        }
        .contact-number {
            direction: ltr;
            color: #0d47a1;
            font-weight: 500;
            background: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        .no-contacts {
            text-align: center;
            color: #777;
            padding: 30px 0;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }
        .badge {
            background: #e8eaf6;
            color: #1a237e;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📇 جهات الاتصال</h1>
    <button id="loadBtn" class="btn">📂 تحميل جهات الاتصال</button>
    <div id="status">⏳ اضغط الزر لعرض جهاتك</div>
    <div id="contactContainer" class="contact-list"></div>
    <div class="footer">
        <span class="badge">⚠️ يعمل على Chrome/Android و Safari/iOS</span>
        <span class="badge">🔒 يتطلب HTTPS</span>
    </div>
</div>

<script>
    (function() {
        const loadBtn = document.getElementById('loadBtn');
        const statusDiv = document.getElementById('status');
        const container = document.getElementById('contactContainer');

        // دالة لعرض جهات الاتصال
        async function loadContacts() {
            // التحقق من دعم الـ API
            if (!('contacts' in navigator) || !navigator.contacts) {
                statusDiv.textContent = '❌ متصفحك لا يدعم Contacts API (جرب Chrome على Android أو Safari).';
                loadBtn.disabled = true;
                return;
            }

            // خصائص نطلبها من جهات الاتصال (الاسم ورقم الهاتف)
            const properties = ['name', 'tel'];

            try {
                statusDiv.textContent = '⏳ جاري تحميل جهات الاتصال...';
                loadBtn.disabled = true;

                // طلب الإذن وعرض منتقي جهات الاتصال
                const contacts = await navigator.contacts.select(properties, {
                    multiple: true   // السماح باختيار عدة جهات
                });

                // contacts هي مصفوفة تحتوي على جهات الاتصال المختارة
                if (!contacts || contacts.length === 0) {
                    statusDiv.textContent = '📭 لم تختر أي جهة اتصال.';
                    container.innerHTML = `<div class="no-contacts">لم تختر أي جهة</div>`;
                    loadBtn.disabled = false;
                    return;
                }

                // بناء قائمة العرض
                let html = '';
                let count = 0;
                contacts.forEach(contact => {
                    // الاسم (قد يكون غير موجود)
                    const name = contact.name && contact.name.length > 0 ? contact.name[0] : 'بدون اسم';
                    // الأرقام (قد تكون متعددة)
                    const numbers = contact.tel && contact.tel.length > 0 ? contact.tel : ['رقم غير متوفر'];

                    // نعرض كل رقم في سطر منفصل (أو يمكن عرض أول رقم فقط)
                    numbers.forEach((number, index) => {
                        html += `
                            <div class="contact-item">
                                <span class="contact-name">${name} ${numbers.length > 1 ? `(${index+1})` : ''}</span>
                                <span class="contact-number">${number}</span>
                            </div>
                        `;
                        count++;
                    });
                });

                container.innerHTML = html;
                statusDiv.textContent = `✅ تم عرض ${count} رقم اتصال (من ${contacts.length} جهة مختارة)`;
                loadBtn.disabled = false;

            } catch (error) {
                // في حال رفض الإذن أو خطأ آخر
                console.error(error);
                if (error.name === 'NotAllowedError' || error.message?.includes('denied')) {
                    statusDiv.textContent = '🚫 تم رفض الإذن بالوصول إلى جهات الاتصال.';
                } else {
                    statusDiv.textContent = '⚠️ حدث خطأ: ' + error.message;
                }
                container.innerHTML = '';
                loadBtn.disabled = false;
            }
        }

        // ربط الزر
        loadBtn.addEventListener('click', loadContacts);

        // فحص أولي للتأكد من الدعم
        if (!('contacts' in navigator) || !navigator.contacts) {
            statusDiv.textContent = '⚠️ متصفحك لا يدعم هذه الميزة.';
            loadBtn.disabled = true;
        } else {
            statusDiv.textContent = '👆 اضغط الزر لعرض جهات الاتصال (سيُطلب منك الإذن).';
        }
    })();
</script>
</body>
</html>
