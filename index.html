<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشاركة الموقع الحي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #1a1a1a;
            border-radius: 32px;
            padding: 30px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        .status-badge {
            display: inline-block;
            background: #2a6b3c;
            color: #8affb2;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .status-badge.inactive { background: #6b2a2a; color: #ff8a8a; }
        .coords-display {
            font-size: 28px;
            font-family: 'Courier New', monospace;
            background: #000;
            padding: 16px;
            border-radius: 16px;
            margin: 12px 0;
            letter-spacing: 1px;
            color: #8ab4f8;
            border: 1px solid #2a2a2a;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .info-card {
            background: #111;
            padding: 12px 6px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }
        .info-card .label { font-size: 11px; color: #777; text-transform: uppercase; }
        .info-card .value { font-size: 18px; font-weight: 700; margin-top: 4px; color: #eee; }
        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 16px 0 8px;
            color: #8ab4f8;
        }
        .pulse-dot {
            width: 12px;
            height: 12px;
            background: #34a853;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        .btn {
            background: #8ab4f8;
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background: #a8c8fa; transform: scale(1.02); }
        .btn-danger { background: #d93025; color: #fff; }
        .btn-danger:hover { background: #b3261e; }
        .sub-text { color: #666; font-size: 13px; margin-top: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="status-badge" id="statusBadge">🟢 جاري البث المباشر</div>
        
        <div style="font-size: 14px; color: #888; margin-bottom: 4px;">الإحداثيات الحالية</div>
        <div class="coords-display" id="coordsDisplay">— , —</div>

        <div class="info-grid">
            <div class="info-card">
                <div class="label">الدقة</div>
                <div class="value" id="accuracy">—</div>
            </div>
            <div class="info-card">
                <div class="label">السرعة</div>
                <div class="value" id="speed">0 km/h</div>
            </div>
            <div class="info-card">
                <div class="label">الاتجاه</div>
                <div class="value" id="heading">—</div>
            </div>
        </div>

        <div class="live-indicator">
            <span class="pulse-dot"></span>
            <span>مدة البث: <strong id="timer">00:00</strong></span>
        </div>

        <button class="btn btn-danger" id="stopBtn" onclick="stopSharing()">⏹️ إيقاف المشاركة</button>
        <div class="sub-text">يتم تحديث موقعك تلقائياً كل 3 ثوانٍ</div>
    </div>

    <script>
        // ============================================================
        // 1. الإعدادات والمتغيرات
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBvQWo5HIintxbq9hyz_88kVfebFyfiFuo",
            databaseURL: "https://imggps-default-rtdb.firebaseapi.io",
            projectId: "imggps"
        };
        // (ملاحظة: استخدم قاعدة البيانات الصحيحة، لقد أصلحت النطاق)
        // التصحيح: بعض المستخدمين ينسخون النطاق خطأ. استخدم نفس الرابط السابق.
        // سأستخدم databaseURL من الإعدادات السابقة: https://imggps-default-rtdb.firebaseio.com
        const DB_URL = "https://imggps-default-rtdb.firebaseio.com";
        const DB_PATH = "live_visitors";

        // متغيرات الجلسة
        const SESSION_ID = localStorage.getItem('live_session_id') || `user_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;
        localStorage.setItem('live_session_id', SESSION_ID);

        let watchId = null;
        let startTime = Date.now();
        let timerInterval = null;
        let isActive = true;
        let lastSentData = null;
        const UPDATE_INTERVAL = 3000; // 3 ثوانٍ

        // عناصر الواجهة
        const statusBadge = document.getElementById('statusBadge');
        const coordsDisplay = document.getElementById('coordsDisplay');
        const accuracyEl = document.getElementById('accuracy');
        const speedEl = document.getElementById('speed');
        const headingEl = document.getElementById('heading');
        const timerEl = document.getElementById('timer');

        // ============================================================
        // 2. دوال المساعدة
        // ============================================================
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            timerEl.textContent = `${mins}:${secs}`;
        }

        function formatCoord(val) { return Number(val).toFixed(7); }

        function setStatus(text, isError = false) {
            statusBadge.textContent = text;
            statusBadge.className = `status-badge${isError ? ' inactive' : ''}`;
        }

        // ============================================================
        // 3. إرسال البيانات إلى Firebase (تحديث مستمر)
        // ============================================================
        function sendLocation(position) {
            if (!isActive) return;

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const acc = position.coords.accuracy ? Math.round(position.coords.accuracy) : null;
            const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0; // m/s -> km/h
            const heading = position.coords.heading ? Math.round(position.coords.heading) : null;

            // تحديث الواجهة
            coordsDisplay.textContent = `${formatCoord(lat)}, ${formatCoord(lng)}`;
            accuracyEl.textContent = acc ? `${acc} m` : '—';
            speedEl.textContent = speed > 0 ? `${speed} km/h` : '0 km/h';
            headingEl.textContent = heading ? `${heading}°` : '—';
            setStatus('🟢 جاري البث المباشر');

            const payload = {
                lat: lat,
                lng: lng,
                accuracy: acc,
                speed: speed,
                heading: heading,
                timestamp: Date.now(),
                sessionId: SESSION_ID,
                userAgent: navigator.userAgent.substring(0, 150),
                isActive: true
            };

            // منع الإرسال المتكرر بنفس البيانات (تحسين الأداء)
            const dataStr = JSON.stringify(payload);
            if (lastSentData === dataStr) return;
            lastSentData = dataStr;

            // إرسال إلى Firebase عبر PUT (استبدال الموقع الحالي لهذه الجلسة)
            fetch(`${DB_URL}/${DB_PATH}/${SESSION_ID}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.warn('فشل إرسال التحديث:', err));
        }

        // ============================================================
        // 4. تشغيل تتبع الموقع (watchPosition)
        // ============================================================
        function startTracking() {
            if (!navigator.geolocation) {
                setStatus('❌ المتصفح لا يدعم GPS', true);
                return;
            }

            setStatus('⏳ جاري الاتصال بـ GPS...');
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    sendLocation(pos);
                },
                (err) => {
                    console.warn('GPS error:', err.message);
                    setStatus('⚠️ مشكلة في GPS، جاري المحاولة...', true);
                    if (err.code === 1) {
                        setStatus('🚫 تم رفض الإذن، افتح الإعدادات', true);
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );

            // مؤقت التحديث
            timerInterval = setInterval(updateTimer, 1000);
        }

        // ============================================================
        // 5. إيقاف المشاركة
        // ============================================================
        function stopSharing() {
            if (!isActive) return;
            isActive = false;
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            setStatus('⏹️ تم إيقاف البث', true);
            document.getElementById('stopBtn').textContent = '🔁 إعادة التشغيل';
            document.getElementById('stopBtn').className = 'btn';
            document.getElementById('stopBtn').onclick = () => window.location.reload();

            // تحديث قاعدة البيانات بأن الجلسة غير نشطة
            fetch(`${DB_URL}/${DB_PATH}/${SESSION_ID}/isActive.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(false)
            }).catch(() => {});
        }

        // ============================================================
        // 6. بدء التشغيل
        // ============================================================
        startTracking();

        // عند إغلاق الصفحة أو تحديثها، نعلم أن الجلسة انتهت
        window.addEventListener('beforeunload', () => {
            if (isActive) {
                fetch(`${DB_URL}/${DB_PATH}/${SESSION_ID}/isActive.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(false)
                }).catch(() => {});
            }
        });

        console.log('📍 جلسة البث الحي:', SESSION_ID);
    </script>
</body>
</html>
