<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التتبع الحي (بدون خادم)</title>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }
        h2 { color: #81c995; text-align: center; margin-bottom: 16px; }
        .setup-box {
            background: #2a2a2a;
            border-radius: 16px;
            border: 1px solid #444;
            padding: 24px;
            max-width: 500px;
            margin: 20px auto;
            text-align: center;
        }
        .setup-box input, .setup-box button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #1e1e1e;
            color: white;
            font-size: 16px;
            margin: 5px;
        }
        .setup-box button {
            background: #81c995;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .setup-box button:hover { background: #6ab87d; }
        .room-id {
            font-size: 24px;
            font-family: monospace;
            background: #0d0d0d;
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-block;
            margin: 10px 0;
            color: #8ab4f8;
            border: 1px solid #333;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .map-wrapper {
            background: #2d2d2d;
            border-radius: 12px;
            border: 1px solid #444;
            overflow: hidden;
            height: 500px;
        }
        #map { height: 100%; width: 100%; }
        .sidebar { display: flex; flex-direction: column; gap: 16px; }
        .card {
            background: #2d2d2d;
            border-radius: 12px;
            border: 1px solid #444;
            padding: 16px;
        }
        .card h3 { color: #81c995; font-size: 15px; margin-bottom: 10px; }
        .visitor-list {
            max-height: 200px;
            overflow-y: auto;
            font-size: 13px;
        }
        .visitor-item {
            padding: 6px 8px;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
        }
        .visitor-item .id { color: #aaa; font-family: monospace; }
        .visitor-item .time { color: #888; font-size: 11px; }
        .online-dot { display: inline-block; width: 8px; height: 8px; background: #34a853; border-radius: 50%; margin-left: 6px; }
        .activity-log {
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: #bbb;
            direction: ltr;
            text-align: left;
        }
        .log-item {
            padding: 4px 6px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
        }
        .badge {
            background: #394457; padding: 2px 12px; border-radius: 30px; font-size: 12px;
        }
        .flex-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .empty-msg { text-align: center; color: #666; padding: 20px; }
        .hidden { display: none; }
        #loaderOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20,20,30,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.6s ease; backdrop-filter: blur(4px);
        }
        #loaderOverlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px; height: 60px;
            border: 5px solid #2d2d2d; border-top: 5px solid #81c995;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { font-size: 20px; color: #ccc; }
        .loader-sub { margin-top: 8px; font-size: 13px; color: #81c995; }
    </style>
</head>
<body>
    <!-- شاشة تحميل متطورة -->
    <div id="loaderOverlay">
        <div class="spinner"></div>
        <div class="loader-text">⏳ جاري تهيئة الاتصال...</div>
        <div class="loader-sub">انتظار انضمام الزائر...</div>
    </div>

    <h2>📍 لوحة التتبع الحي (P2P)</h2>

    <div id="setupBox" class="setup-box">
        <h3 style="color:#81c995; margin-bottom:12px;">🔐 إنشاء غرفة جديدة</h3>
        <button onclick="createRoom()">🆕 إنشاء غرفة</button>
        <div style="margin-top:12px;">
            <span style="color:#888;">أو انضم إلى غرفة موجودة:</span><br>
            <input type="text" id="roomInput" placeholder="أدخل معرف الغرفة">
            <button onclick="joinRoom()">انضمام</button>
        </div>
        <div id="roomDisplay" style="display:none; margin-top:15px;">
            <div style="color:#888;">معرف الغرفة (شاركه مع الزائر):</div>
            <div class="room-id" id="roomIdDisplay"></div>
            <button onclick="copyRoomId()" style="background:#394457;color:white;">📋 نسخ</button>
        </div>
        <div id="statusMsg" style="margin-top:10px; color:#f28b82;"></div>
    </div>

    <div id="dataContainer" class="hidden">
        <div class="flex-row">
            <div>
                <span class="badge">🟢 المتصلون: <span id="onlineCount">0</span></span>
                <span class="badge" style="margin-right:8px;">📌 إجمالي الجلسات: <span id="totalSessions">0</span></span>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="map-wrapper">
                <div id="map"></div>
            </div>
            <div class="sidebar">
                <div class="card">
                    <h3>📡 الزوار النشطون</h3>
                    <div class="visitor-list" id="visitorList">
                        <div class="empty-msg">لا يوجد زوار متصلون</div>
                    </div>
                </div>
                <div class="card" style="flex:1;">
                    <h3>📋 سجلات النشاط</h3>
                    <div class="activity-log" id="activityLog">
                        <div class="empty-msg">لا توجد سجلات</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. المتغيرات العامة
        // ============================================================
        let peer = null;
        let connections = {}; // visitorId -> dataConnection
        let visitors = {};   // visitorId -> { lat, lng, accuracy, speed, heading, timestamp, peerId }
        let map = null;
        const markers = {};
        let roomId = '';

        const loader = document.getElementById('loaderOverlay');
        const setupBox = document.getElementById('setupBox');
        const dataContainer = document.getElementById('dataContainer');
        const roomIdDisplay = document.getElementById('roomIdDisplay');
        const statusMsg = document.getElementById('statusMsg');

        // ============================================================
        // 2. الخريطة
        // ============================================================
        function initMap() {
            if (map) return;
            map = L.map('map').setView([30.0444, 31.2357], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            setTimeout(() => map.invalidateSize(), 500);
        }

        function updateMarker(visitorId, data) {
            if (!map) return;
            const { lat, lng } = data;
            if (lat == null || lng == null) return;
            if (markers[visitorId]) {
                markers[visitorId].setLatLng([lat, lng]);
                markers[visitorId].getPopup().setContent(`
                    <b>🆔 ${visitorId.substring(0, 8)}</b><br>
                    📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>
                    🎯 ${data.accuracy || '?'} m<br>
                    🚀 ${data.speed || 0} km/h<br>
                    ⏱️ ${new Date(data.timestamp).toLocaleTimeString('ar-EG')}
                `);
            } else {
                const marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup(`
                    <b>🆔 ${visitorId.substring(0, 8)}</b><br>
                    📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>
                    🎯 ${data.accuracy || '?'} m<br>
                    🚀 ${data.speed || 0} km/h<br>
                    ⏱️ ${new Date(data.timestamp).toLocaleTimeString('ar-EG')}
                `);
                markers[visitorId] = marker;
            }
        }

        // ============================================================
        // 3. تحديث واجهة القائمة والنشاط
        // ============================================================
        function updateUI() {
            const container = document.getElementById('visitorList');
            const online = Object.keys(visitors).length;
            document.getElementById('onlineCount').textContent = online;
            document.getElementById('totalSessions').textContent = online;

            if (online === 0) {
                container.innerHTML = '<div class="empty-msg">لا يوجد زوار متصلون</div>';
                return;
            }
            container.innerHTML = Object.entries(visitors)
                .sort((a, b) => b[1].timestamp - a[1].timestamp)
                .map(([id, data]) => `
                    <div class="visitor-item">
                        <span class="id">${id.substring(0, 8)} <span class="online-dot" style="background:#34a853;"></span></span>
                        <span class="time">${new Date(data.timestamp).toLocaleTimeString('ar-EG')} · ${data.lat?.toFixed(4) || '?'}</span>
                    </div>
                `).join('');
        }

        function addLog(action, details = '') {
            const logContainer = document.getElementById('activityLog');
            const timestamp = new Date().toLocaleTimeString('ar-EG');
            const entry = document.createElement('div');
            entry.className = 'log-item';
            entry.innerHTML = `<span class="log-action">${action} ${details}</span><span class="log-time">${timestamp}</span>`;
            logContainer.prepend(entry);
            while (logContainer.children.length > 20) {
                logContainer.removeChild(logContainer.lastChild);
            }
            const empty = logContainer.querySelector('.empty-msg');
            if (empty) empty.remove();
        }

        // ============================================================
        // 4. دوال PeerJS
        // ============================================================
        function createRoom() {
            peer = new Peer({ debug: 2 });
            peer.on('open', (id) => {
                roomId = id;
                roomIdDisplay.textContent = id;
                document.getElementById('roomDisplay').style.display = 'block';
                setupBox.querySelector('button').textContent = '⏳ انتظار زائر...';
                setupBox.querySelector('button').disabled = true;
                statusMsg.textContent = 'شارك المعرف مع الزائر';
                statusMsg.style.color = '#8affb2';
                startListening();
            });
            peer.on('error', (err) => {
                statusMsg.textContent = 'خطأ: ' + err.message;
                statusMsg.style.color = '#f28b82';
                console.error(err);
            });
        }

        function startListening() {
            peer.on('connection', (conn) => {
                const visitorId = conn.peer;
                connections[visitorId] = conn;
                addLog('🟢 زائر متصل', visitorId.substring(0, 8));

                conn.on('data', (data) => {
                    if (data.type === 'location') {
                        const { lat, lng, accuracy, speed, heading, timestamp } = data;
                        visitors[visitorId] = { lat, lng, accuracy, speed, heading, timestamp };
                        updateMarker(visitorId, visitors[visitorId]);
                        updateUI();
                    }
                });

                conn.on('close', () => {
                    delete connections[visitorId];
                    delete visitors[visitorId];
                    if (markers[visitorId]) {
                        map.removeLayer(markers[visitorId]);
                        delete markers[visitorId];
                    }
                    addLog('🔴 زائر غير متصل', visitorId.substring(0, 8));
                    updateUI();
                });
            });

            // إخفاء شاشة التحميل بعد 1 ثانية
            setTimeout(() => {
                loader.classList.add('hidden');
                setupBox.style.display = 'none';
                dataContainer.classList.remove('hidden');
                initMap();
            }, 1000);
        }

        function joinRoom() {
            const id = document.getElementById('roomInput').value.trim();
            if (!id) {
                statusMsg.textContent = 'الرجاء إدخال معرف الغرفة';
                statusMsg.style.color = '#f28b82';
                return;
            }
            // فتح نافذة الزائر مع المعرف
            const url = `./index.html?room=${encodeURIComponent(id)}`;
            window.open(url, '_blank');
            statusMsg.textContent = 'تم فتح صفحة الزائر، انتظر الاتصال...';
            statusMsg.style.color = '#8affb2';
            // نبدأ الاستماع في هذه النافذة أيضاً (للمشرف)
            // ولكننا سنحتاج إلى Peer جديد كمشرف متصل بنفس الغرفة
            // الحل: المشرف ينشئ Peer جديد ويتصل بالغرفة بنفسه، لكن الأسهل أن المشرف يفتح صفحة الزائر في تبويب آخر.
            // لكننا سنقوم بإنشاء Peer جديد والاستماع كما في createRoom، مع إضافة منطق أن يكون المشرف هو المضيف.
            // ولكن قد يسبب تعقيداً. بدلاً من ذلك، نجعل المشرف ينشئ الغرفة كما في createRoom، والزائر يدخل المعرف.
            // لذا نضغط على "إنشاء غرفة" أولاً.
            alert('للاستخدام الصحيح: اضغط "إنشاء غرفة" أولاً، ثم شارك المعرف مع الزائر.');
        }

        function copyRoomId() {
            const id = roomIdDisplay.textContent;
            navigator.clipboard.writeText(id).then(() => {
                statusMsg.textContent = 'تم نسخ المعرف!';
                statusMsg.style.color = '#8affb2';
            }).catch(() => {
                // طريقة بديلة
                const range = document.createRange();
                range.selectNode(roomIdDisplay);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                statusMsg.textContent = 'تم نسخ المعرف!';
            });
        }

        // ============================================================
        // 5. ربط الدوال للاستخدام في الأزرار
        // ============================================================
        window.createRoom = createRoom;
        window.joinRoom = joinRoom;
        window.copyRoomId = copyRoomId;

        // إخفاء شاشة التحميل في البداية
        loader.classList.add('hidden');

        console.log('✅ لوحة المشرف جاهزة');
    </script>
</body>
</html>
